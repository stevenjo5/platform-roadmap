apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-web-service
  labels:
    tier: {{ .Values.global.tier }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ .Release.Name }}-web
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: 80
