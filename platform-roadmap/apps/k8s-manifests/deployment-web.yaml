apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-web-deployment
  labels:
    tier: production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: resilient-web
  template:
    metadata:
      labels:
        app: resilient-web
    spec:
      containers:
        - name: web-container
          image: nginx:alpine
          ports:
            - containerPort: 80
