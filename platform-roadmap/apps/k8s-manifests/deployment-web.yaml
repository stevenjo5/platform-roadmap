apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-web-deployment
  labels:
    tier: production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: resilient-web
  template:
    metadata:
      labels:
        app: resilient-web
    spec:
      containers:
        - name: web-container
          image: nginx:alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          env:
            - name: PLATFORM_DB_CONNECTION
              valueFrom:
                secretKeyRef:
                  name: platform-db-secret
                  key: DATABASE_URL
          volumeMounts:
            - name: config-volume
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
            - name: platform-persistent-storage
              mountPath: /var/log/nginx
      volumes:
        - name: config-volume
          configMap:
            name: platform-web-config
        - name: platform-persistent-storage
          persistentVolumeClaim:
            claimName: platform-production-pvc
