apiVersion: v1
kind: Pod
metadata:
  name: platform-security-audit-pod
  labels:
    app: security-test
spec:
  containers:
    - name: test-container
      image: nginx:alpine
      imagePullPolicy: IfNotPresent
      env:
        - name: PLATFORM_DB_CONNECTION
          valueFrom:
            secretKeyRef:
              name: platform-db-secret
              key: DATABASE_URL
